<svg xmlns="http://www.w3.org/2000/svg" width="5120" height="2880" viewBox="0 0 5120 2880">
  <defs>
    <pattern id="hex" width="120" height="208" patternUnits="userSpaceOnUse">
      <path d="M60 0 L120 34 L120 104 L60 138 L0 104 L0 34 Z"
            fill="none" stroke="#6E7B8B" stroke-opacity="0.12" stroke-width="1.5"/>
    </pattern>
    <radialGradient id="vig" cx="46%" cy="44%" r="76%">
      <stop offset="58%" stop-color="#131317" stop-opacity="0"/>
      <stop offset="100%" stop-color="#131317" stop-opacity="0.17"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <!-- void field -->
  <rect width="5120" height="2880" fill="#16161A"/>
  <rect width="5120" height="2880" fill="url(#hex)"/>


  <!-- depth and texture -->
  <rect width="5120" height="2880" fill="url(#vig)"/>
  <rect width="5120" height="2880" filter="url(#grain)" opacity="0.07" style="mix-blend-mode:screen"/>
</svg>
