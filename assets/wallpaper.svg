<svg xmlns="http://www.w3.org/2000/svg" width="5120" height="2880" viewBox="0 0 5120 2880">
  <defs>
    <pattern id="hex" width="120" height="208" patternUnits="userSpaceOnUse">
      <path d="M60 0 L120 34 L120 104 L60 138 L0 104 L0 34 Z"
            fill="none" stroke="#4A4741" stroke-opacity="0.075" stroke-width="1.5"/>
    </pattern>
    <radialGradient id="vig" cx="46%" cy="44%" r="76%">
      <stop offset="58%" stop-color="#4A4741" stop-opacity="0"/>
      <stop offset="100%" stop-color="#4A4741" stop-opacity="0.17"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <!-- parchment field -->
  <rect width="5120" height="2880" fill="#CAC5B0"/>
  <rect width="5120" height="2880" fill="url(#hex)"/>

  <!-- baseline rule, lower third -->
  <line x1="340" y1="2140" x2="4780" y2="2140" stroke="#4A4741" stroke-opacity="0.35" stroke-width="2"/>
  <line x1="340" y1="2131" x2="340" y2="2149" stroke="#4A4741" stroke-opacity="0.4" stroke-width="2"/>
  <line x1="4780" y1="2131" x2="4780" y2="2149" stroke="#4A4741" stroke-opacity="0.4" stroke-width="2"/>

  <!-- sparse survey crosses, corners kept clear for the HUD -->
  <g stroke="#4A4741" stroke-opacity="0.25" stroke-width="2">
    <path d="M700 486 v28 M686 500 h28"/>
    <path d="M1608 366 v28 M1594 380 h28"/>
    <path d="M2486 686 v28 M2472 700 h28"/>
    <path d="M1186 1486 v28 M1172 1500 h28"/>
    <path d="M2086 1886 v28 M2072 1900 h28"/>
    <path d="M886 2386 v28 M872 2400 h28"/>
    <path d="M4286 586 v28 M4272 600 h28"/>
    <path d="M4686 2386 v28 M4672 2400 h28"/>
    <path d="M2886 286 v28 M2872 300 h28"/>
  </g>

  <!-- depth and texture -->
  <rect width="5120" height="2880" fill="url(#vig)"/>
  <rect width="5120" height="2880" filter="url(#grain)" opacity="0.085" style="mix-blend-mode:multiply"/>
</svg>
